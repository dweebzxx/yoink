<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <mask id="mascot-face">
    <!-- Solid white squircle keeps the mask visible -->
    <rect x="0" y="0" width="24" height="24" fill="white" />
    <!-- Black cutouts for the winking face features -->
    <!-- Left winking eye (>) -->
    <path d="M 6.5 9 L 9 10.5 L 6.5 12" fill="none" stroke="black" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right open eye -->
    <circle cx="15.5" cy="10.5" r="1.6" fill="black" />
    <!-- Smiling mouth -->
    <path d="M 8.5 14.5 Q 11 17.5 13.5 14.5" fill="none" stroke="black" stroke-width="1.8" stroke-linecap="round" />
  </mask>
  <!-- Main squircle mascot shape with face cutouts -->
  <rect x="3" y="3" width="18" height="18" rx="5" ry="5" fill="currentColor" mask="url(#mascot-face)" />
</svg>
